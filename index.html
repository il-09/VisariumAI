/* Minimal workspace refinement */
.sidebar{width:252px;padding:15px 10px 12px;overflow-x:hidden;transition:width .2s ease,padding .2s ease,background .25s ease}
.sidebar.collapsed{width:76px;padding:15px 8px 12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 4px;margin-bottom:18px;min-height:40px}
.brand-mark{width:38px;height:38px;min-width:38px;border-radius:12px;box-shadow:none}
.brand-mark svg{width:24px;height:24px}
.sidebar-toggle{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:9px;flex-shrink:0}
.sidebar-toggle svg{width:16px;height:16px;transition:transform .18s ease}
.sidebar.collapsed .brand{justify-content:center;gap:5px;padding:0}
.sidebar.collapsed .brand-mark{width:38px}
.sidebar.collapsed .sidebar-toggle{width:20px;height:26px;padding:0;border-color:transparent;background:transparent}
.sidebar.collapsed .sidebar-toggle svg{transform:rotate(0deg)}
.sidebar:not(.collapsed) .sidebar-toggle svg{transform:rotate(180deg)}
.sidebar .brand-name,.sidebar .brand-sub,.sidebar .kbd,.sidebar .knowledge-mini{display:none!important}
.new-chat{height:41px;min-height:41px;box-shadow:none;justify-content:flex-start;gap:9px;padding:0 11px;white-space:nowrap}
.new-chat .plus{font-size:20px}
.sidebar.collapsed .new-chat{width:42px;padding:0;justify-content:center;margin:0 auto}
.sidebar.collapsed .new-chat-label,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-item span,.sidebar.collapsed .profile-copy{display:none!important}
.nav-label{margin:18px 10px 8px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:700;white-space:nowrap}
.nav-group{gap:3px}
.nav-item{height:42px;min-height:42px;padding:0 11px;border-radius:10px;gap:12px;font-size:13px;white-space:nowrap}
.nav-item svg{width:19px;height:19px}
.sidebar.collapsed .nav-item{width:44px;padding:0;justify-content:center;margin:0 auto}
.nav-item .nav-count{display:none!important}.nav-item[hidden]{display:none!important}
.profile{padding:11px 2px 0;gap:8px}
.profile .avatar{height:34px;width:34px;min-width:34px;border-radius:11px}
.profile-name{font-size:12px}.profile-role{font-size:10px}
.profile-menu{margin-left:auto;display:grid;place-items:center;min-width:28px;height:28px;border-radius:8px}
.sidebar.collapsed .profile{justify-content:center;gap:3px}
.sidebar.collapsed .profile-menu{margin:0;width:26px;min-width:26px;padding:0}
.app-main{margin-left:76px;width:calc(100% - 76px);transition:margin-left .2s ease,width .2s ease}
body:has(.sidebar:not(.collapsed)) .app-main{margin-left:252px;width:calc(100% - 252px)}
.topbar{height:54px;min-height:54px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--bg);backdrop-filter:none}
.topbar-left{gap:0}.topbar-right{gap:0}
.mobile-menu{height:34px;width:34px;border:0;background:transparent}
.theme-toggle.icon-only{width:34px;height:34px;padding:0;display:grid;place-items:center;border:1px solid var(--border);border-radius:11px;box-shadow:none;background:var(--panel)}
.theme-toggle.icon-only svg{width:17px;height:17px}
.workspace{padding:25px clamp(16px,3vw,36px) 32px;max-width:1600px}
.content-grid{grid-template-columns:minmax(0,1fr) 190px;gap:18px}
.conversation-column{max-width:880px;display:flex;flex-direction:column;min-height:calc(100vh - 110px)}
.page-heading{margin:0 0 17px;align-items:center}
.page-heading h1{font-size:23px;letter-spacing:-.55px;margin:0}
.page-heading p,.page-heading .eyebrow{display:none!important}
.welcome-block{padding:54px 10px 18px;max-width:760px}
.welcome-block h2{font-size:27px;line-height:1.2;letter-spacing:-.7px;margin:0;font-weight:750}
.welcome-block p,.assistant-mark{display:none!important}
.mode-switcher{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:19px;flex-wrap:wrap}
.mode-chip{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--muted);padding:6px 10px;font-size:12px;font-weight:650;transition:.15s}
.mode-chip svg{height:15px;width:15px;color:var(--blue)}
.mode-chip:hover{background:var(--panel);border-color:var(--blue-2);color:var(--text)}
.quick-grid{display:none!important}
.chat-stream{flex:1;gap:16px;padding:10px 4px 20px}
.message-name{display:none!important}
.message-bubble{box-shadow:none;font-size:14px;padding:13px 15px}
.chat-composer{margin-top:auto;box-shadow:0 8px 28px color-mix(in srgb,var(--blue) 7%,transparent);border:1px solid var(--border-strong);border-radius:18px;background:var(--panel)}
.composer-form{border:0;box-shadow:none;border-radius:18px;padding:15px 16px 11px}
.composer-form textarea{font-size:15px;min-height:37px}
.composer-bottom{margin-top:8px}
.disclaimer{display:none!important}
.right-rail{display:flex;flex-direction:column;gap:8px;padding-top:0;position:sticky;top:70px}
.rail-card{padding:0;border:0;box-shadow:none;background:transparent}
.rail-card .rail-head,.rail-card>.rail-action,.rail-card .source-mini,.rail-card .rail-foot,.right-rail>.callout{display:none!important}
.rail-disclosure{border:1px solid var(--border);background:var(--panel);border-radius:12px;overflow:hidden}
.rail-disclosure summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:40px;padding:9px 10px;font-size:12px;font-weight:700;color:var(--text)}
.rail-disclosure summary::-webkit-details-marker{display:none}
.rail-disclosure summary::after{content:'+';margin-left:auto;font-size:18px;color:var(--muted);font-weight:400}
.rail-disclosure[open] summary::after{content:'−'}
.rail-disclosure summary svg{width:16px;height:16px;color:var(--blue)}
.rail-disclosure-body{padding:3px 7px 8px;border-top:1px solid var(--border)}
.rail-action{min-height:34px;padding:6px 5px;border:0;background:transparent;box-shadow:none;border-radius:7px}
.rail-action .quick-icon{width:27px;height:27px;min-width:27px;margin:0;border-radius:8px}
.rail-action strong{font-size:11px}
.rail-action>svg{width:13px;height:13px}
.source-jump{width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.source-jump:hover{background:var(--panel-alt)}
.page-panel,.form-panel,.result-card{box-shadow:none;border-radius:15px}
.page-panel{padding:21px}
.section-head{margin-bottom:13px;align-items:center}
.section-head h2{font-size:15px;margin:0}
.section-head p{display:none!important}
.template-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.template-card{min-height:102px;padding:14px;border-radius:13px;box-shadow:none}
.template-card .quick-icon{width:30px;height:30px;margin-bottom:10px}
.template-card h3{font-size:13px;margin:0 0 8px}
.template-card p{display:none!important}
.template-foot{font-size:11px;padding-top:8px;margin-top:auto}
.callout,.checker-note,.preview-card,.preview-status,.preview-rule,.intro,.field-help{display:none!important}
.form-layout.single{grid-template-columns:minmax(0,1fr);max-width:900px}
.form-panel{padding:20px}
.form-fields{gap:14px}
.form-fields .field label{font-size:12px;margin-bottom:5px}
.form-fields .field input,.form-fields .field textarea,.field select{min-height:40px;padding:9px 11px;font-size:13px}
.form-fields .field textarea{min-height:76px}
.result-card{margin-top:18px;padding:17px}
.result-head{align-items:center;gap:12px}
.result-head h3{font-size:15px;margin:0}
.result-content{font-size:13px;line-height:1.7;white-space:pre-wrap}
.upload-icon{display:none!important}
.dropzone{padding:30px 15px;border-radius:13px}
.dropzone h3{font-size:14px;margin:0 0 12px}
.dropzone p{display:none!important}
.checker-controls{border:0;padding:13px 0 0;margin-top:12px}
.finding{box-shadow:none;border-radius:11px;padding:13px}
.finding p{font-size:12px}
.finding-meta{font-size:10px}
.knowledge-search-head{margin:0 0 19px!important}
.search-line{max-width:100%;width:100%;min-height:42px;border-radius:12px;background:var(--panel);box-shadow:none}
.knowledge-groups{display:flex;flex-direction:column;gap:23px}
.knowledge-group h2{font-size:14px;margin:0 0 10px;font-weight:750}
.knowledge-group .source-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:9px}
.source-card{padding:12px;border-radius:12px;box-shadow:none;min-height:84px}
.source-card-body h3{font-size:12px;line-height:1.4;margin:0 0 9px}
.source-card-body>p{display:none!important}
.source-meta{margin-top:0;font-size:10px}
.source-open{font-size:11px}
.history-row{padding:11px 0}
.history-main strong{font-size:12px}
.history-main small{display:none!important}
.empty-state{padding:35px 12px}
.admin-add-form{border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:20px}
.admin-add-form h2,.admin-source-list h2{font-size:15px;margin:0 0 14px}
.admin-source-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(100px,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.admin-source-row span:nth-child(2){color:var(--muted);font-size:11px}
.export-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.export-form .field{min-width:0}
.export-form .field input,.export-form .field select{width:100%;min-width:0}
.modal{max-height:90vh;overflow:auto}
.modal-top p{display:none!important}
.modal-content>p{margin-top:0}

/* Design system v2 — calm, rounded, deliberately restrained */

  --teal:#3C8179;
  --green:#32796C;
  --green-soft:#E1F0E9;
  --amber:#A87931;
  --amber-soft:#F6EDDA;
  --red:#A95656;
  --red-soft:#F6E5E3;
  --shadow:0 20px 60px rgba(34,59,64,.10);
  --shadow-small:0 7px 24px rgba(34,59,64,.07);
  --radius:24px;
  --radius-sm:17px;
  --input:#FCFDFB;
  --rail:#F7F9F6;
}

  --amber:#E1C18B;
  --amber-soft:#4C4538;
  --red:#E6A4A1;
  --red-soft:#4A353A;
  --shadow:0 22px 60px rgba(7,20,23,.22);
  --shadow-small:0 8px 24px rgba(7,20,23,.15);
  --input:#253A42;
  --rail:#253B43;
}

 {type:'chat',title:'Как согласовать приказ о вводе ИС?',sub:'Диалог',prompt:'Как согласовать приказ о вводе информационной системы в эксплуатацию?'},
 {type:'create',title:'Распоряжение о создании рабочей группы',sub:'Создан документ',templateId:'group'},

],selectedTemplate=null,currentDraft=null,attachedFile=null,checkedDocumentText='',checkResult=false,toastTimer;
const workspace=document.getElementById('workspace');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('cdobr-theme',theme)}catch(e){}const dark=theme==='dark';const iconEl=document.getElementById('themeIcon');if(iconEl)iconEl.innerHTML=ICONS[dark?'moon':'sun'];const themeColor=document.querySelector('meta[name="theme-color"]');if(themeColor)themeColor.content=dark?'#1c2c42':'#f4f7fc';const toggle=document.getElementById('themeToggle');if(toggle){toggle.title=dark?'Переключить на светлую тему':'Переключить на тёмную тему';toggle.setAttribute('aria-label',toggle.title)}}
function initTheme(){const fallback=document.documentElement.dataset.theme==='dark'?'dark':'light';let chosen=fallback;try{if(location.pathname.endsWith('prototype_cdobr.html'))chosen=localStorage.getItem('cdobr-theme')||fallback}catch(e){}setTheme(chosen)}
function setPage(page){if(!PAGE_LABELS[page])return;if(page==='admin'&&currentRole!=='admin')page='chat';currentPage=page;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('sidebar').classList.remove('open');renderPage()}

function initTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light')}

function goTo(page){setPage(page)}
function heading(eyebrow,title,desc,badge=''){return `<div class="page-heading"><h1>${title}</h1></div>`}

function renderChat(){
 const welcome=chatMessages.length===0?`<div class="welcome-block" id="welcome"><h2>Чем помочь с документами?</h2><div class="mode-switcher"><button class="mode-chip" data-prompt="Как определить обязательные согласующие для приказа о вводе информационной системы в эксплуатацию?">${icon('search')} Найти ответ</button><button class="mode-chip" data-go="create">${icon('plusfile')} Создать документ</button><button class="mode-chip" data-go="check">${icon('checkfile')} Проверить документ</button></div><div class="starter-prompts"><button class="starter-prompt" data-prompt="Кто должен визировать приказ о вводе информационной системы в эксплуатацию?">${icon('users')} Кто визирует приказ о вводе ИС?</button><button class="starter-prompt" data-prompt="Какие реквизиты нужно заполнить в распоряжении о создании рабочей группы?">${icon('fileSearch')} Какие реквизиты нужны для распоряжения?</button><button class="starter-prompt" data-prompt="Как проверить актуальность модуля документа?">${icon('book')} Как проверить актуальность модуля?</button></div></div>`:'';
 const messages=chatMessages.map(m=>`<div class="chat-message ${m.role==='user'?'user':''}"><div class="msg-avatar">${icon(m.role==='user'?'chat':'sparkles')}</div><div class="message-body"><div class="message-bubble">${m.html}</div>${m.citations?.length?`<div class="citation-row">${m.citations.map(c=>`<button class="citation" data-preview-citation="${esc(c)}">${icon('file')} ${esc(c)}</button>`).join('')}</div>`:''}${m.role==='assistant'?`<div class="message-actions"><button class="text-action" data-copy-message="${esc(m.plain||'')}">${icon('clipboard')} Копировать</button><button class="text-action" data-go="knowledge">${icon('book')} Источники</button></div>`:''}</div></div>`).join('');
 return `<section class="content-grid"><div class="conversation-column">${welcome}<div class="chat-stream" id="chatStream">${messages}</div><div class="chat-composer"><form class="composer-form" id="chatForm"><textarea id="chatInput" placeholder="Спросите об инструкции или документе…" rows="1" aria-label="Ваш вопрос"></textarea><div class="composer-bottom"><button class="send-button" type="submit" aria-label="Отправить сообщение">${icon('send')}</button></div></form></div></div><aside class="right-rail"><details class="rail-disclosure"><summary>${icon('sparkles')} Инструменты</summary><div class="rail-disclosure-body">${railAction('plusfile','Создать документ','','create')}${railAction('checkfile','Проверить документ','','check')}${railAction('book','Поиск по инструкции','','knowledge')}${railAction('grid','Модули документов','','templates')}</div></details><details class="rail-disclosure"><summary>${icon('book')} Материалы</summary><div class="rail-disclosure-body"><button class="source-mini source-jump" data-go="knowledge"><span class="doc-icon">${icon('file')}</span><span><span class="source-title">Инструкция по ДОУ</span></span></button><button class="source-mini source-jump" data-go="knowledge"><span class="doc-icon">${icon('list')}</span><span><span class="source-title">Матрица визирования</span></span></button><button class="source-mini source-jump" data-go="templates"><span class="doc-icon">${icon('grid')}</span><span><span class="source-title">6 модулей</span></span></button></div></details></aside></section>`;
}
function renderCreate(){if(selectedTemplate)return renderTemplateForm(selectedTemplate);return `<div class="page-wrap">${heading('','Создать документ')}<div class="page-panel"><div class="template-grid">${templates.map(t=>`<button class="template-card" data-template="${t.id}"><span class="quick-icon">${icon(t.icon)}</span><h3>${esc(t.name)}</h3><div class="template-foot"><span>${t.tag}</span>${icon('arrow')}</div></button>`).join('')}</div></div></div>`}
function renderTemplateForm(id){const t=templates.find(x=>x.id===id);if(!t){selectedTemplate=null;return renderCreate()}return `<div class="page-wrap">${heading('',t.short)}<div class="form-layout single"><form class="form-panel" id="templateForm"><div class="form-fields">${t.fields.map(([key,label,placeholder,required])=>`<div class="field ${['items','goal','purpose','result','members'].includes(key)?'full':''}"><label for="f-${key}">${esc(label)} ${required?'<span class="required">*</span>':''}</label>${['items','goal','purpose','result','members'].includes(key)?`<textarea id="f-${key}" name="${key}" placeholder="${esc(placeholder)}" ${required?'required':''}></textarea>`:`<input id="f-${key}" name="${key}" type="text" placeholder="${esc(placeholder)}" ${required?'required':''}>`}</div>`).join('')}</div><div class="form-actions"><button class="button-quiet" type="button" data-action="back-templates">${icon('right')} Назад</button><button class="button-primary" type="submit">Создать документ ${icon('right')}</button></div></form></div><div id="draftResult"></div></div>`}
function renderTemplates(){return `<div class="page-wrap">${heading('','Модули документов')}<div class="page-panel"><div class="template-grid">${templates.map(t=>`<button class="template-card" data-template="${t.id}"><span class="quick-icon">${icon(t.icon)}</span><h3>${esc(t.name)}</h3><div class="template-foot"><span>${t.tag}</span>${icon('arrow')}</div></button>`).join('')}</div></div></div>`}
function renderCheck(){return `<div class="page-wrap">${heading('','Проверить документ')}<div class="page-panel"><div class="dropzone" id="dropzone"><input type="file" id="fileInput" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" aria-label="Выбрать документ"><div class="upload-icon">${icon('upload')}</div><h3>Добавить документ</h3><button class="button-secondary" type="button" id="browseFileBtn">${icon('folder')} Выбрать файл</button></div><div id="selectedFile"></div><div class="checker-controls"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button-secondary" type="button" id="exampleCheckBtn">Пример проверки</button><button class="button-primary" type="button" id="runCheckBtn" ${attachedFile?'':'disabled'} style="opacity:${attachedFile?'1':'.55'}">${icon('checkfile')} Проверить</button></div></div></div><div id="checkResults"></div></div>`}
function renderCheckResults(){return `<div class="result-card"><div class="result-head"><h3>Результат проверки</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="soft-badge">${icon('info')} 3 замечания</span><button class="button-primary" id="editCheckedDocumentBtn">Редактировать документ</button></div></div><div class="finding-list"><div class="finding"><div class="finding-mark error">${icon('alert')}</div><div class="finding-content"><div class="finding-title">Не заполнены реквизиты</div><p>Проверьте основание издания, обязательные сведения и сроки.</p><div class="finding-meta"><span>Высокая критичность</span><span>Обязательные поля</span></div></div><span class="finding-status">Проверить</span></div><div class="finding"><div class="finding-mark warning">${icon('alert')}</div><div class="finding-content"><div class="finding-title">Уточните маршрут визирования</div><p>Для приказов по информационным системам учитываются юридическое подразделение, ДОУ, а также ИБ и ИТ по условиям Матрицы.</p><div class="finding-meta"><span>Средняя критичность</span><span>Матрица, строка 3</span></div></div><span class="finding-status">Уточнить</span></div><div class="finding"><div class="finding-mark info">${icon('info')}</div><div class="finding-content"><div class="finding-title">Проверьте статус модуля</div><p>Сверьте редакцию, владельца и дату начала применения с реестром модулей.</p><div class="finding-meta"><span>Информация</span><span>Методические рекомендации, п. 1.2</span></div></div><span class="finding-status">Подтвердить</span></div></div></div>`}
function renderKnowledge(){return `<div class="page-wrap">${heading('','База знаний')}<div class="section-head knowledge-search-head"><div class="search-line">${icon('search')}<input id="sourceSearch" type="search" placeholder="Поиск по файлам и содержанию…" aria-label="Поиск в базе знаний"></div></div><div class="knowledge-groups" id="sourceGrid">${renderSourceGroups(sources,false)}</div></div>`}
function sourceCategory(s){if(s.category)return s.category;if(s.name.startsWith('Модуль:'))return 'Модули документов';if(s.name.includes('Матрица')||s.name.includes('Методические'))return 'Матрицы и методические материалы';return 'Инструкции и регламенты'}
function renderSourceGroups(list,expandMatches=false){if(!list.length)return `<div class="empty-state"><b>Ничего не найдено</b></div>`;const order=[...new Set(['Инструкции и регламенты','Матрицы и методические материалы','Модули документов','Материалы кейса',...customKnowledgeSections,...list.map(sourceCategory)])];return order.map(cat=>{const items=list.filter(s=>sourceCategory(s)===cat);return items.length?`<details class="knowledge-group" ${expandMatches?'open':''}><summary><span>${esc(cat)}</span><span class="knowledge-count">${items.length}</span></summary><div class="source-grid">${renderSourceCards(items)}</div></details>`:''}).join('')}
function renderSourceCards(list){if(!list.length)return '';return list.map(s=>`<article class="source-card"><div class="doc-icon">${icon('file')}</div><div class="source-card-body"><h3>${esc(s.name)}</h3><div class="source-meta"><span class="source-type">${esc(s.type||'Файл')}</span><button class="source-open" data-source="${sources.indexOf(s)}" aria-label="Открыть ${esc(s.name)}">Открыть ${icon('arrow')}</button></div></div></article>`).join('')}
function renderHistory(){return `<div class="page-wrap">${heading('','История')}<div class="page-panel"><div class="section-head"><h2>Недавние действия</h2><button class="button-secondary" id="clearHistoryBtn">${icon('refresh')} Очистить историю</button></div><div class="history-list">${historyItems.length?historyItems.map((h,i)=>`<div class="history-row"><div class="history-icon">${icon(h.type==='create'?'plusfile':h.type==='check'?'checkfile':h.type==='knowledge'?'book':'chat')}</div><div class="history-main"><strong>${esc(h.title)}</strong></div><button data-history="${i}">Открыть ${icon('arrow')}</button></div>`).join(''):`<div class="empty-state"><span class="quick-icon">${icon('clock')}</span><b>История пуста</b></div>`}</div></div></div>`}
function renderPage(){selectedTemplate=currentPage==='create'?selectedTemplate:null;workspace.innerHTML=currentPage==='chat'?renderChat():currentPage==='create'?renderCreate():currentPage==='check'?renderCheck():currentPage==='knowledge'?renderKnowledge():currentPage==='templates'?renderTemplates():currentPage==='admin'?renderAdmin():renderHistory();wireDynamic();}
function renderAdmin(){if(currentRole!=='admin')return renderChat();const cats=[...new Set([...sources.map(sourceCategory),...customKnowledgeSections])];return `<div class="page-wrap">${heading('','Управление базой')}<div class="page-panel"><div class="admin-section-tools"><input id="newKnowledgeSection" placeholder="Название нового раздела"><button class="button-primary" id="addKnowledgeSectionBtn">Добавить раздел</button></div><form class="admin-add-form" id="addSourceForm"><h2>Добавить файл</h2><div class="form-fields"><div class="field full"><label for="adminFile">Файл</label><input id="adminFile" name="adminFile" type="file" accept=".pdf,.docx,.doc" required></div><div class="field"><label for="adminCategory">Раздел</label><select id="adminCategory" name="adminCategory">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="adminStatus">Статус</label><select id="adminStatus" name="adminStatus"><option>Статус в реестре не подтверждён</option><option>Вступает в силу 01.11.2026</option><option>Неактуален</option></select></div></div><button class="button-primary" type="submit">Добавить в базу</button></form><div class="admin-source-list"><h2>Файлы базы знаний</h2>${sources.map((src,i)=>`<div class="admin-source-row"><span>${esc(src.name)}</span><span>${esc(sourceCategory(src))}</span><button class="button-secondary" data-edit-source="${i}">Редактировать</button><button class="button-quiet" data-deactivate-source="${i}">${src.status==='Неактуален'?'Неактуален':'Деактивировать'}</button></div>`).join('')}</div></div></div>`}
function buildAnswer(question){const q=question.toLowerCase();if(q.includes('ввод')&&(q.includes('ис')||q.includes('информацион')||q.includes('эксплуатац'))){return {html:`<p>Для учебного кейса по приказу о вводе в эксплуатацию информационной системы маршрут нужно определять по <b>виду и содержанию проекта</b>, а также по Матрице обязательного визирования.</p><ul><li><b>Юридическое подразделение</b> — обязательная виза по соответствующей строке Матрицы.</li><li><b>Департамент ДОУ</b> — обязательная виза.</li><li><b>Департамент информационной безопасности</b> и <b>Департамент информационных технологий</b> — должны быть учтены для документа по информационной системе в соответствии с содержанием строки 3 Матрицы.</li></ul><p>Затем сохраняется установленная последовательность визирования: исполнитель, участники разработки, руководитель подразделения, заинтересованные подразделения, подразделения обязательного визирования, юридическое подразделение (если обязательно), ДОУ (если обязательно), координирующее должностное лицо.</p><p>Это ответ по предоставленным учебным материалам; окончательный маршрут следует сверить с актуальной редакцией Матрицы и компетенциями затронутых подразделений.</p>`,plain:'Для приказа о вводе в эксплуатацию ИС маршрут определяется по виду и содержанию проекта и Матрице. Учитываются обязательные юридическое подразделение и Департамент ДОУ, а также ИБ и ИТ для информационной системы. Точная маршрутизация проверяется по действующей Матрице.',citations:['Матрица обязательного визирования · строка 3','Инструкция по ДОУ · пп. 10.6, 10.11']};}
 if(q.includes('распоряж')&&(q.includes('срок')||q.includes('рабоч')))return {html:`<p>В предоставленном учебном примере Инструкции по ДОУ в пункте 10.3 указан максимальный срок каждого первичного и повторного рассмотрения <b>распоряжения — 3 рабочих дня</b> со дня поступления документа в подразделение через ИИС ДО.</p><p>Это срок рассмотрения одного этапа, а не гарантия, что весь маршрут согласования завершится за 3 дня: общий график зависит от последовательности процедур и числа согласующих.</p>`,plain:'По п. 10.3 Инструкции по ДОУ максимальный срок каждого первичного или повторного рассмотрения распоряжения — 3 рабочих дня со дня поступления через ИИС ДО.',citations:['Инструкция по ДОУ · п. 10.3, стр. 42']};
 if(q.includes('модул')||q.includes('шаблон')||q.includes('актуальн'))return {html:`<p>Перед использованием модульного документа необходимо проверить его сведения в реестре актуальных модулей: <b>наименование, регистрационные данные, дату, редакцию, владельца, статус и начало применения</b>.</p><p>Если проект полностью соответствует утверждённому модулю, повторное полное согласование с подразделениями, согласовавшими сам модуль, может не требоваться. При этом лингвистическая экспертиза, визирование ДОУ и другие обязательные процедуры сохраняются. Если меняются постоянные формулировки, обязательные пункты или смысл решения, нужен полный маршрут согласования.</p><p>В загруженных учебных материалах реестровые метаданные каждого модуля не представлены, поэтому их актуальность здесь подтверждённой не считается.</p>`,plain:'Актуальность модуля подтверждается только по реестру: наименование, регистрационные данные, дата, редакция, владелец, статус и начало применения. Если метаданных нет, статус не подтверждён.',citations:['Методические рекомендации · пп. 1.2–1.3','Инструкция по ДОУ · пп. 9.16.1–9.16.3']};
 if(q.includes('передач')||q.includes('имуще')||q.includes('дел и'))return {html:`<p>Для приказа о приёме и передаче дел и имущества используйте соответствующий модуль. В нём должны быть указаны основание, лицо или подразделение, сдающее дела, принимающая сторона, состав передаваемых дел и имущества, представитель организации, срок и ответственный за контроль.</p><p>Если передача связана с предоставлением, изменением или прекращением доступа к информационным системам, проект дополнительно визирует Департамент информационной безопасности — это условие прямо отражено в Матрице.</p>`,plain:'В приказе о приёме и передаче дел укажите основание, сдающую и принимающую стороны, перечень имущества и документов, представителя, срок и контроль. При изменении доступа к информационным системам включается ИБ.',citations:['Модуль приказа о приёме и передаче дел · примечания 1–8','Матрица обязательного визирования · строка 2']};
 if(q.includes('подпис')||q.includes('регистрац'))return {html:`<p>Согласно пунктам 10.1–10.2 Инструкции по ДОУ, стандартный процесс включает подготовку проекта, внутреннее согласование, первичное рассмотрение заинтересованными подразделениями, согласование и визирование, лингвистическую экспертизу (когда обязательна), визирование координирующего лица, подписание и регистрацию.</p><p>Регистрационный номер подписываемого документа не присваивается до подписания и направления на регистрацию. Завизированная и подписываемая версии должны совпадать; существенные изменения после согласования требуют повторного рассмотрения и визирования.</p>`,plain:'Процесс: подготовка, внутреннее согласование, первичное рассмотрение, согласование и визирование, обязательная лингвистическая экспертиза, виза координирующего лица, подписание, регистрация. Номер до подписания и регистрации не присваивается.',citations:['Инструкция по ДОУ · пп. 10.1–10.2','Методические рекомендации · пп. 5.1–5.3']};
 return {html:`<p>Я не нашёл достаточно подтверждённых сведений в базе знаний, чтобы ответить уверенно.</p><p>Чтобы дать точный ответ, уточните <b>тип документа</b> и задачу: подготовка, оформление, согласование, визирование, подписание или регистрация. Можно также открыть базу знаний и поискать конкретный пункт инструкции.</p><p>Я не буду придумывать требования, которых нет в доступных источниках.</p>`,plain:'В базе знаний не найдено достаточно данных для уверенного ответа. Нужны тип документа и уточнение процесса; не следует придумывать требования.',citations:['База знаний · требуется уточнение']};}
function sendChat(question){const q=question.trim();if(!q)return;chatMessages.push({role:'user',html:esc(q).replace(/\n/g,'<br>'),plain:q});const pending={role:'assistant',html:'<p>Ищу подтверждённые положения в базе знаний…</p>',plain:'Ищу источники…',citations:[]};chatMessages.push(pending);renderPage();const stream=document.getElementById('chatStream');if(stream)stream.scrollTop=stream.scrollHeight;fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка сервера');pending.plain=data.answer||'Ответ не получен.';pending.html=formatAssistantAnswer(pending.plain);pending.citations=data.sources||[];}).catch(err=>{pending.plain='Не удалось связаться с сервером VisariumAI. Убедитесь, что приложение запущено через Go-сервер.';pending.html='<p>'+esc(pending.plain)+'</p>';pending.citations=[];showToast('Ошибка подключения к серверу')}).finally(()=>{addHistory({type:'chat',title:q.length>60?q.slice(0,57)+'…':q,sub:'Только что · Диалог с помощником',prompt:q});renderPage();const st=document.getElementById('chatStream');if(st)st.scrollTop=st.scrollHeight;});}

 const af=document.getElementById('addSourceForm');if(af)af.addEventListener('submit',e=>{e.preventDefault();const file=document.getElementById('adminFile').files[0];if(!file)return;const cat=document.getElementById('adminCategory').value;const status=document.getElementById('adminStatus').value;sources.push({name:file.name,sub:cat,status,desc:'Источник добавлен администратором.',type:/\.pdf$/i.test(file.name)?'PDF':'DOCX',key:file.name.toLowerCase(),category:cat});renderPage();showToast('Источник добавлен')});document.querySelectorAll('[data-deactivate-source]').forEach(b=>b.addEventListener('click',()=>{const src=sources[Number(b.dataset.deactivateSource)];if(src){src.status='Неактуален';renderPage();showToast('Статус источника обновлён')}}));document.querySelectorAll('[data-action="back-templates"]').forEach(b=>b.addEventListener('click',()=>{selectedTemplate=null;renderPage()}));document.querySelectorAll('[data-action="open-knowledge"]').forEach(b=>b.addEventListener('click',()=>setPage('knowledge')));}
function wireSourceOpenOnly(){document.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>{const source=sources[Number(b.dataset.source)];if(source)openModal(source.name,'',`<p>${esc(source.desc)}</p>`,'Найти требования',()=>{document.getElementById('modalRoot').innerHTML='';setPage('chat');const input=document.getElementById('chatInput');if(input){input.value='Что установлено в документе «'+source.name+'»?';input.focus()}})}))}
function updateRoleUI(){const admin=currentRole==='admin';document.querySelectorAll('.admin-only').forEach(el=>el.hidden=!admin);document.querySelectorAll('.nav-item[data-page="admin"]').forEach(el=>el.setAttribute('aria-hidden',String(!admin)));const name=document.getElementById('profileName'),role=document.getElementById('profileRole'),avatar=document.querySelector('.profile .avatar');if(name)name.textContent=admin?'Администратор':'Пользователь';if(role)role.textContent=admin?'Администратор базы знаний':'Стандартный доступ';if(avatar)avatar.textContent=admin?'АД':'П';const btn=document.getElementById('profileInfo');if(btn)btn.title=admin?'Администратор базы знаний':'Роль и доступ'}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.page==='create')selectedTemplate=null;setPage(b.dataset.page)}));document.getElementById('themeToggle').addEventListener('click',()=>{setTheme(document.documentElement.dataset.theme==='light'?'dark':'light')});document.getElementById('newChatBtn').addEventListener('click',()=>{chatMessages=[];selectedTemplate=null;attachedFile=null;setPage('chat')});const sidebar=document.getElementById('sidebar');document.getElementById('sidebarToggle').addEventListener('click',()=>{sidebar.classList.toggle('collapsed');const b=document.getElementById('sidebarToggle');b.setAttribute('aria-label',sidebar.classList.contains('collapsed')?'Развернуть рабочее пространство':'Свернуть рабочее пространство');b.title=sidebar.classList.contains('collapsed')?'Рабочее пространство — развернуть':'Рабочее пространство — свернуть'});document.getElementById('mobileMenu').addEventListener('click',()=>sidebar.classList.toggle('open'));document.getElementById('profileInfo').addEventListener('click',()=>openModal('Роль','',`<div class="field"><label for="roleSelect">Роль</label><select id="roleSelect"><option value="user" ${currentRole==='user'?'selected':''}>Сотрудник / исполнитель</option><option value="admin" ${currentRole==='admin'?'selected':''}>Администратор базы знаний</option></select></div>`, 'Применить', ()=>{currentRole=document.getElementById('roleSelect').value;updateRoleUI();if(currentRole!=='admin'&&currentPage==='admin')currentPage='chat';document.getElementById('modalRoot').innerHTML='';renderPage();showToast(currentRole==='admin'?'Права администратора включены':'Права сотрудника включены')}));
initTheme();updateRoleUI();renderPage();
</script>
</body></html>
